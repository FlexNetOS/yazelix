# Proof workflow for Yazelix's pinned canonical FlexNetOS runner consumer.
# Dispatched manually; same-repository changes run on the composed runner via its labels.
# Green run = the substrate executes real workflows/actions on the yazelix foundation.
name: flexnetos-runner-smoke

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/flexnetos-runner-smoke.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/flexnetos-runner-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, flexnetos, nix]
    env:
      PATH: /home/flexnetos/.nix-profile/bin:/home/flexnetos/.nix-profile/toolbin:/usr/bin:/bin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Foundation toolchain reaches workflows
        run: |
          echo "runner name: $RUNNER_NAME"
          echo "runner os:   $RUNNER_OS"
          nu --version
          bun --version
          nix --version
      - name: Canonical pinned closure doctors on the substrate
        shell: /home/flexnetos/.nix-profile/bin/bash {0}
        run: |
          app="$(/home/flexnetos/.nix-profile/bin/nix eval .#apps.x86_64-linux.gha-runner.program --raw)"
          test -x "$app"
          "$app" doctor
      - name: Nushell step (foundation shell law)
        shell: /home/flexnetos/.nix-profile/toolbin/nu {0}
        run: |
          let runtime = '/home/flexnetos/meta/var/lib/yazelix/runtime/profile'
          if not ($runtime | path exists) { error make {msg: $"missing Yazelix profile runtime: ($runtime)"} }
          if not (('/home/flexnetos/.nix-profile/bin/flexnetos-runner-start' | path exists)) {
            error make {msg: 'missing profile-owned canonical runner launcher'}
          }
          print $"profile-runtime reachable: ($runtime)"

  fork-isolation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Keep fork pull requests off the self-hosted runner
        run: echo "fork pull request is intentionally isolated from self-hosted FlexNetOS runners"
