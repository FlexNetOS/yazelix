# Proof workflow for the FlexNetOS self-hosted runner (nix/gha-runner).
# Dispatched manually; runs ONLY on the composed runner via its labels.
# Green run = the substrate executes real workflows/actions on the yazelix foundation.
name: flexnetos-runner-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, flexnetos, nix]
    steps:
      - uses: actions/checkout@v4
      - name: Foundation toolchain reaches workflows
        run: |
          echo "runner name: $RUNNER_NAME"
          echo "runner os:   $RUNNER_OS"
          nu --version
          bun --version
          nix --version
      - name: Offline gate executes on the runner itself
        run: bun run nix/gha-runner/verify.mjs
      - name: rUv agent layer doctors on the substrate (hermetic closure)
        run: nix run ./nix/gha-runner#runner -- agent doctor
      - name: Nushell step (foundation shell law)
        shell: nu {0}
        run: |
          print $"profile-runtime reachable: (('/run/user/1001/yazelix/profile-runtime' | path exists))"
