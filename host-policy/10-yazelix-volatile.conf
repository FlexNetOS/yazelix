# Generic cache and temporary state is volatile. Kache, model weights, browser
# binaries, and the starship log dir are persistent on durable home storage.
#
# SCOPE WARNING: this file is installed into ~/.config/environment.d, which is read
# by the systemd USER MANAGER -- the parent of gnome-session and every desktop app.
# Anything set here applies to the whole graphical session, not just dev shells.
#
# XDG_DATA_HOME / XDG_STATE_HOME / XDG_CACHE_HOME are therefore NOT set here. They
# are generic levers: pointing XDG_DATA_HOME at the meta payload re-homes GNOME's
# keyring, icons, launchers and Trash along with the tool state it was meant to
# move, and pointing XDG_CACHE_HOME into /run/user puts the mesa shader cache and
# thumbnails on the same tmpfs budget as XDG_RUNTIME_DIR. Dev-shell scoping for
# those three lives in nushell profile-path.nu instead.
SHELL=/home/flexnetos/.nix-profile/toolbin/nu
YAZELIX_STATE_DIR=/run/user/1001/yazelix/profile-runtime/yazelix
NIX_CACHE_HOME=/run/user/1001/yazelix/volatile/cache/nix
TMPDIR=/run/user/1001/yazelix/volatile/tmp
TMP=/run/user/1001/yazelix/volatile/tmp
TEMP=/run/user/1001/yazelix/volatile/tmp
# Cargo artifacts are durable, not volatile: /run/user/1001 is XDG_RUNTIME_DIR and
# shares its tmpfs budget with the wayland socket, dconf, dbus and gnome-keyring.
# A single workspace build reached 30G here and drove the tmpfs to 84%, which
# starves the session's own runtime plane. These belong on disk.
CARGO_HOME=/home/flexnetos/meta/var/cache/cargo-home
CARGO_TARGET_DIR=/home/flexnetos/meta/var/cargo-target
RUSTUP_HOME=/run/user/1001/yazelix/volatile/rustup-home
npm_config_cache=/run/user/1001/yazelix/volatile/cache/npm
BUN_INSTALL_CACHE_DIR=/run/user/1001/yazelix/volatile/cache/bun
YARN_CACHE_FOLDER=/run/user/1001/yazelix/volatile/cache/yarn
COREPACK_HOME=/run/user/1001/yazelix/volatile/cache/corepack
UV_CACHE_DIR=/run/user/1001/yazelix/volatile/cache/uv
PIP_CACHE_DIR=/run/user/1001/yazelix/volatile/cache/pip
PIP_NO_CACHE_DIR=1
GOCACHE=/run/user/1001/yazelix/volatile/cache/go-build
GOMODCACHE=/run/user/1001/yazelix/volatile/cache/go-mod
GRADLE_USER_HOME=/run/user/1001/yazelix/volatile/cache/gradle
DENO_DIR=/run/user/1001/yazelix/volatile/cache/deno
HF_HOME=/home/flexnetos/.cache/huggingface
TORCH_HOME=/home/flexnetos/.cache/torch
CUDA_CACHE_PATH=/run/user/1001/yazelix/volatile/cache/cuda
PLAYWRIGHT_BROWSERS_PATH=/home/flexnetos/.cache/playwright
STARSHIP_CACHE=/home/flexnetos/.cache/starship
KACHE_CACHE_DIR=/home/flexnetos/.cache/kache
RUSTC_WRAPPER=/home/flexnetos/.nix-profile/bin/kache-rustc-wrapper
CARGO_BUILD_RUSTC_WRAPPER=/home/flexnetos/.nix-profile/bin/kache-rustc-wrapper
NIX_SENTRY_ENDPOINT=
DETSYS_IDS_TELEMETRY=disabled
