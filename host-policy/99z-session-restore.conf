# Session-scope restore, delivered by the profile alongside 10-yazelix-volatile.conf.
#
# FILENAME IS LOAD-BEARING. systemd merges ~/.config/environment.d, /etc/environment.d
# and /usr/lib/environment.d into ONE lexically-sorted namespace; a file in $HOME does
# NOT outrank /usr/lib except when the names match exactly. Ubuntu ships
# /usr/lib/environment.d/99-environment.conf (-> /etc/environment) and 990-snapd.conf,
# both of which assign PATH. This file must sort AFTER those, hence the "99z" prefix.
# A "90-" name is silently overridden for PATH and the loss is invisible on disk.
# Verify any rename with:
#   /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator
#
# WHY THIS FILE EXISTS (2026-07-27 session-env incident): ~/.config/environment.d is
# read by the systemd USER MANAGER, which is the parent of gnome-session and every
# desktop app on Ubuntu. Dev-toolchain values placed there escape the dev shell and
# re-home the whole desktop -- an amputated PATH left snaps and .desktop launchers
# unresolvable, and a redirected XDG_DATA_HOME gave GNOME a fresh empty login keyring.

# Path law is preserved: the nix profile stays FIRST (ownership = precedence, not
# exclusivity). Dropping /usr/bin and /snap/bin never made the profile more
# authoritative -- it only made system capabilities unreachable.
PATH=/home/flexnetos/.nix-profile/toolbin:/home/flexnetos/.nix-profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

# Generic XDG roots. These previously pointed at the real home, which restored the
# desktop but wrote a home-dotted user path into a profile-owned source file and so
# failed the strict profile source ownership gate -- the path law admits no such owner.
#
# meta/var/xdg-{data,state} is the documented target of the tool-state migration
# (meta/var/ops/README-migrate-tool-state.md); the migration script has already staged
# the payload there. Pointing the roots here is the lever that runbook calls for. The
# earlier meta/var/lib values that broke the desktop are NOT these -- those re-homed the
# session onto the database payload tier, which has no keyring, icons, Trash or
# launchers. This tier is the tool-state tier and carries them.
#
# environment.d is read by the systemd user manager at session start, so this takes
# effect on the next login rather than mid-session. Dev-shell scoping lives in nushell
# profile-path.nu, not here.
XDG_DATA_HOME=/home/flexnetos/meta/var/xdg-data
XDG_STATE_HOME=/home/flexnetos/meta/var/xdg-state
XDG_CACHE_HOME=/home/flexnetos/.cache

# Cargo MUST NOT resolve under /run/user/1001 -- that is XDG_RUNTIME_DIR, whose tmpfs
# budget is shared with the wayland socket, dconf, dbus and gnome-keyring. A single
# workspace build reached 30G there and drove the tmpfs to 84%, starving the session's
# own runtime plane. Duplicated from 10-yazelix-volatile.conf deliberately: this file
# is the backstop if an older 10-* is still installed.
CARGO_HOME=/home/flexnetos/meta/var/cache/cargo-home
CARGO_TARGET_DIR=/home/flexnetos/meta/var/cargo-target

# ICM resolves its database only from --db / ICM_DB / the XDG default; the
# [store].path config key is parsed but ignored. icm-web.service runs under the
# manager env with no --db flag, so without this anchor a re-homed XDG_DATA_HOME
# silently serves a stale copy instead of the live table.
ICM_DB=/home/flexnetos/meta/var/xdg-data/icm/memories.db
